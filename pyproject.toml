[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "small-auto-mode"
version = "0.1.0"
description = "Independent tool-call authorization research and sub-billion-parameter classifier training"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5"]

[project.scripts]
small-auto-mode = "small_auto_mode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
